# CI Pipeline
# ============================================================================
# Runs quality gates on every push to main and on pull requests targeting main.
#
# Design choices:
# - Uses dorny/paths-filter to skip CI on docs-only changes (saves minutes)
# - Reads Node version from .node-version (single source of truth for runtime)
# - `npm run verify` runs the blocking gate, including the strict version-floor
#   CVE check (previously pre-commit only, so a --no-verify push went unchecked)
# - The heuristic security scan runs as a separate advisory job, scoped to the
#   PR diff: it is pattern-based with known false positives, and a full-tree
#   scan takes minutes, so it reports without blocking the merge
# - 10-minute timeout prevents hung processes from burning Actions minutes
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Determine what changed to skip unnecessary work
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.yml'
              - 'package.json'
              - 'package-lock.json'

  quality:
    needs: changes
    # Skip quality checks if only docs changed
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Read Node version from .node-version — enforces the compatibility matrix.
      - name: Read Node version
        id: node-version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verify gate
        run: npm run verify

  # Advisory only — reports pattern matches on the PR diff without blocking.
  security-scan:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
        with:
          # Need the base branch present for the --since diff.
          fetch-depth: 0
          # This job runs a script from the PR revision. Don't leave the
          # checkout token readable in .git/config — the scan only reads
          # local history, so it never needs credentials.
          persist-credentials: false

      - name: Scan files changed in this pull request
        run: |
          bash scripts/security-check.sh \
            --since "origin/${{ github.base_ref }}"
